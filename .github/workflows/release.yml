name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build CLI
        run: pnpm build:cli
      - name: Package VSIX
        run: pnpm package:extension
      - name: Rename artifacts
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cp dist-bin/wanwu.mjs "dist-bin/wanwu-${VER}.mjs"
          VSIX=$(ls extensions/wanwu-vscode/*.vsix | head -1)
          cp "$VSIX" "extensions/wanwu-vscode/wanwu-code-${VER}.vsix"
          ls -la dist-bin/ extensions/wanwu-vscode/*.vsix
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-bin/wanwu-*.mjs
            extensions/wanwu-vscode/wanwu-code-*.vsix
          body: |
            Wanwu-Code **v1.0 beta** release artifacts.

            - VS Code extension VSIX
            - CLI single-file bundle (`node wanwu-*.mjs …`)

            See `CHANGELOG.md` for details.
