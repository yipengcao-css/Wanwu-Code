name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from package.json packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build CLI (mjs + native matrix)
        run: pnpm build:cli:native
      - name: Package VSIX
        run: pnpm package:extension
      - name: List artifacts
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          ls -lah dist-bin/
          test -f "dist-bin/wanwu-${VER}-linux-x64"
          test -f "dist-bin/wanwu-${VER}.mjs"
          test -f dist-bin/SHA256SUMS
          VSIX=$(ls extensions/wanwu-vscode/*.vsix | head -1)
          cp "$VSIX" "extensions/wanwu-vscode/wanwu-code-${VER}.vsix"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-bin/wanwu-*.mjs
            dist-bin/wanwu-*-linux-x64
            dist-bin/wanwu-*-macos-x64
            dist-bin/wanwu-*-macos-arm64
            dist-bin/wanwu-*-win-x64.exe
            dist-bin/SHA256SUMS
            extensions/wanwu-vscode/wanwu-code-*.vsix
          body: |
            Wanwu-Code release artifacts (E2-C matrix).

            - CLI native: linux-x64 / macos-x64 / macos-arm64 / win-x64
            - CLI portable: `wanwu-*.mjs` (Node ≥20)
            - VS Code extension VSIX
            - Desktop mac zips: uploaded by `desktop-mac` job when available（签名见 `docs/SIGNING.md`）
            - Checksums: `SHA256SUMS`

            Install: see `docs/INSTALL.md`

  desktop-mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build mac desktop zips
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WANWU_SHELL_TARGETS: mac
        run: pnpm shell:dist
      - name: Upload mac zips to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/wanwu-shell/release/Wanwu-Code-*-mac-*.zip
          fail_on_unmatched_files: false
