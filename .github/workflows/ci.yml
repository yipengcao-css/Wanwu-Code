name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from package.json packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Smoke ACP (mock + wanwu-native)
        run: ./scripts/smoke-acp.sh
      - name: Native ACP handshake
        run: pnpm exec tsx scripts/acp-handshake-native.mts
      - name: Demo E2E
        run: ./scripts/demo-e2e.sh
      - name: Parallel worktrees + cloud runner
        run: |
          pnpm wanwu parallel demo --cleanup
          pnpm wanwu cloud submit -p "ci cloud review" --run
          pnpm wanwu cloud cleanup --purge
      - name: Permission probe
        run: |
          pnpm wanwu check-perm -p 'cat ~/.ssh/id_rsa' && exit 1 || true
          pnpm wanwu check-perm -p 'pnpm test'
      - name: Build CLI bundle
        run: pnpm build:cli
      - name: Bench (record)
        run: pnpm exec tsx scripts/bench/run-all.mts --ci
        continue-on-error: true
      - name: Upload bench results
        uses: actions/upload-artifact@v4
        with:
          name: wanwu-bench
          path: bench-results/latest.json
      - name: Package VSIX
        run: pnpm package:extension
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: wanwu-code-vsix
          path: extensions/wanwu-vscode/*.vsix
      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: wanwu-cli-bundle
          path: dist-bin/wanwu.mjs

  docker-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pure Docker cloud runner (no fallback)
        env:
          WANWU_DOCKER_REQUIRE: "1"
        run: |
          set -euo pipefail
          set +e
          OUT=$(pnpm wanwu -- cloud submit -p "gha pure docker" --docker)
          ec=$?
          set -e
          echo "$OUT"
          echo "$OUT" | tee /tmp/cloud-docker-out.json
          PARSE=$(node -e 'const s=require("fs").readFileSync(0,"utf8"); const a=s.lastIndexOf("{"); const b=s.lastIndexOf("}"); if(a<0||b<=a){console.error("no json"); process.exit(2)}; const j=JSON.parse(s.slice(a,b+1)); console.log(JSON.stringify({id:j.id,status:j.status}))' <<<"$OUT")
          echo "PARSE=$PARSE"
          TASK_ID=$(node -e 'console.log(JSON.parse(process.argv[1]).id || "")' "$PARSE")
          STATUS=$(node -e 'console.log(JSON.parse(process.argv[1]).status || "")' "$PARSE")
          echo "TASK_ID=$TASK_ID status=$STATUS host_exit=$ec"
          LOG=".wanwu/cloud-tasks/${TASK_ID}/docker-runner.log"
          if [[ ! -f "$LOG" ]]; then
            echo "missing $LOG" >&2
            ls -la ".wanwu/cloud-tasks/${TASK_ID}/" >&2 || ls -la .wanwu/cloud-tasks >&2 || true
            exit 1
          fi
          if grep -q '\[fallback\] docker run failed on nested overlay' "$LOG"; then
            echo "UNEXPECTED FALLBACK in pure-docker CI job" >&2
            cat "$LOG" >&2
            exit 1
          fi
          if [[ "$STATUS" != "succeeded" || "$ec" -ne 0 ]]; then
            echo "docker task failed status=$STATUS host_exit=$ec" >&2
            cat "$LOG" >&2
            exit 1
          fi
          echo "OK: pure docker path for $TASK_ID"
      - name: Upload docker cloud artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanwu-docker-cloud
          path: .wanwu/cloud-tasks/**
          if-no-files-found: warn
