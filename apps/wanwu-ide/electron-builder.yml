appId: com.wanwu.code
productName: Wanwu Code
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources
    to: backend
    filter:
      - "**/*.mjs"
asarUnpack:
  - "**/node_modules/node-pty/**"
linux:
  target:
    - dir
  category: Development
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
