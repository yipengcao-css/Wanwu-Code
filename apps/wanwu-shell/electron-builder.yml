appId: com.wanwu.code
productName: Wanwu Code
copyright: Copyright © Wanwu
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  # Monaco is bundled by Vite into dist/renderer; don't ship raw monaco-editor/typescript in asar.
  - "!node_modules/monaco-editor/**/*"
  - "!node_modules/typescript/**/*"
  - "!node_modules/typescript-language-server/**/*"
  - "!node_modules/@monaco-editor/**/*"
extraResources:
  # Staged by scripts/stage-shell-acp.sh before each platform build
  - from: resources/wanwu-cli
    to: wanwu-cli
extraMetadata:
  main: dist/electron/main.js
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
afterSign: scripts/afterSign-notarize.cjs
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Wanwu <wanwu@example.com>
win:
  target:
    - zip
  artifactName: ${productName}-${version}-win-${arch}.${ext}
mac:
  target:
    - zip
  category: public.app-category.developer-tools
  # identity omitted: electron-builder uses CSC_LINK / keychain when present.
  # scripts/build-shell-dist.sh sets CSC_IDENTITY_AUTO_DISCOVERY=false for unsigned builds.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
